<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<title>Experiência Bimby® — Formulário</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f3f5f1; font-family: 'Inter', sans-serif; color: #222; -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; }

  /* Variant chooser tabs */
  .variant-tabs {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid #eef0ec;
    padding: 12px 20px; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .variant-tabs .brand { font-weight: 800; color: #2E9E60; font-size: 16px; margin-right: auto; letter-spacing: -0.5px; }
  .variant-tabs button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid #eef0ec;
    background: #fff; cursor: pointer; font-size: 12px; font-family: inherit; color: #444;
    min-height: 40px;
  }
  .variant-tabs button.on { background: #2E9E60; color: #fff; border-color: #2E9E60; }
  .variant-tabs .saved { font-size: 11px; color: #999; margin-right: 12px; }

  .variant-shell { padding: 24px 20px 60px; }

  /* MOBILE — under 720px */
  @media (max-width: 720px) {
    .variant-tabs {
      padding: 10px 12px; gap: 6px;
      position: sticky;
    }
    .variant-tabs .brand { font-size: 14px; flex: 1 1 auto; }
    .variant-tabs .saved { display: none; }
    .variant-tabs .variant-picker { display: block !important; }
    .variant-tabs .variant-buttons { display: none; }
    .variant-tabs button {
      padding: 10px 12px; font-size: 13px; min-height: 44px;
    }
    .variant-tabs .actions {
      width: 100%; display: flex; gap: 6px; order: 2;
    }
    .variant-tabs .actions button { flex: 1; }
    .variant-shell { padding: 14px 12px 60px; }
    body.preview-mode .pdf-print-only {
      padding: 0; background: #ddd;
      overflow-x: auto;
      align-items: flex-start;
    }
    /* Scale down PDF preview on mobile so it fits the screen */
    body.preview-mode .pdf-form {
      transform: scale(min(1, calc((100vw - 16px) / 794)));
      transform-origin: top center;
      margin-bottom: -700px; /* trim the empty space below scaled preview */
    }
  }
  @media (min-width: 721px) {
    .variant-tabs .variant-picker { display: none; }
  }
  @media (max-width: 600px) {
    .resp-2col, .resp-3col { grid-template-columns: 1fr !important; }
  }

  /* PDF preview area: hidden on screen by default, but shown when previewing */
  .pdf-print-only { display: none; }
  body.preview-mode .pdf-print-only {
    display: flex; justify-content: center; padding: 20px 0 60px;
    background: #ddd; min-height: 100vh;
  }
  body.preview-mode .variant-shell { display: none; }

  @media print {
    @page { size: 210mm 297mm; margin: 0; }
    html, body {
      background: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 210mm !important;
      height: 297mm !important;
    }
    .variant-tabs, .variant-shell { display: none !important; }
    .pdf-print-only {
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
      background: #fff !important;
      min-height: 0 !important;
      width: 210mm !important;
      height: 297mm !important;
      overflow: hidden !important;
    }
    .pdf-form {
      box-shadow: none !important;
      width: 794px !important;
      height: 1123px !important;
      transform-origin: top left !important;
      page-break-after: avoid;
      page-break-inside: avoid;
      overflow: hidden !important;
    }
    *, *::before, *::after {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/schema.jsx"></script>
  <script type="text/babel" src="src/brand.jsx"></script>
  <script type="text/babel" src="src/form-controls.jsx"></script>
  <script type="text/babel" src="src/signature-pad.jsx"></script>
  <script type="text/babel" src="src/pdf-form.jsx"></script>
  <script type="text/babel" src="src/variant-wizard.jsx"></script>
  <script type="text/babel" src="src/variants.jsx"></script>
  <script type="text/babel" src="src/mobile-wizard.jsx"></script>

  <script type="text/babel">
    const STORAGE_KEY = "bimby-form-v1";

    function todayBR() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return { ddmmyyyy: `${dd}${mm}${d.getFullYear()}`, iso: `${d.getFullYear()}-${mm}-${dd}` };
    }

    // Generate PDF directly via html2canvas+jsPDF (works on mobile, where window.print() often fails)
    async function exportPDF() {
      // Make sure preview is mounted and visible
      const wrap = document.querySelector('.pdf-print-only');
      const pdfNode = wrap?.querySelector('.pdf-form');
      if (!pdfNode) { alert('Erro: PDF ainda não está pronto.'); return; }

      // Show a quick loading state
      const btn = document.activeElement;
      const oldText = btn?.textContent;
      if (btn) { btn.textContent = '⏳ A gerar...'; btn.disabled = true; }

      // Force the node to be visible offscreen for capture
      const prevDisplay = wrap.style.display;
      const prevPos = wrap.style.position;
      const prevLeft = wrap.style.left;
      const prevTop = wrap.style.top;
      const prevZ = wrap.style.zIndex;
      wrap.style.cssText = 'display:block;position:fixed;left:-10000px;top:0;z-index:-1;background:#fff;';

      try {
        // Lazy-load libs once
        if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
        if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

        // Wait for fonts/images
        if (document.fonts) await document.fonts.ready;
        await new Promise(r => setTimeout(r, 100));

        const canvas = await window.html2canvas(pdfNode, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          width: 794,
          height: 1123,
          windowWidth: 794,
          windowHeight: 1123,
        });
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');

        const fileName = `Experiencia_Bimby_${new Date().toISOString().slice(0,10)}.pdf`;
        pdf.save(fileName);
      } catch (e) {
        console.error(e);
        alert('Não foi possível gerar o PDF: ' + (e.message || e));
      } finally {
        // Restore wrap style
        wrap.style.display = prevDisplay;
        wrap.style.position = prevPos;
        wrap.style.left = prevLeft;
        wrap.style.top = prevTop;
        wrap.style.zIndex = prevZ;
        if (btn && oldText) { btn.textContent = oldText; btn.disabled = false; }
      }
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Falha a carregar ' + src));
        document.head.appendChild(s);
      });
    }

    function useIsMobile(breakpoint = 720) {
      const [is, setIs] = React.useState(() => typeof window !== 'undefined' && window.innerWidth <= breakpoint);
      React.useEffect(() => {
        const onR = () => setIs(window.innerWidth <= breakpoint);
        window.addEventListener('resize', onR);
        return () => window.removeEventListener('resize', onR);
      }, [breakpoint]);
      return is;
    }

    function App() {
      const isMobile = useIsMobile();
      const [variant, setVariant] = React.useState(() => localStorage.getItem("bimby-variant") || "wizard");
      const [savedAt, setSavedAt] = React.useState(null);
      const [previewing, setPreviewing] = React.useState(false);
      const [mobileExited, setMobileExited] = React.useState(false);

      React.useEffect(() => {
        document.body.classList.toggle("preview-mode", previewing);
      }, [previewing]);

      const [data, setData] = React.useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        const t = todayBR();
        return { data: t.ddmmyyyy, dataISO: t.iso };
      });

      // Autosave
      React.useEffect(() => {
        const t = setTimeout(() => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          setSavedAt(new Date());
        }, 400);
        return () => clearTimeout(t);
      }, [data]);

      // Persist variant
      React.useEffect(() => {
        localStorage.setItem("bimby-variant", variant);
      }, [variant]);

      const setField = React.useCallback((k, v) => {
        setData((d) => ({ ...d, [k]: v }));
      }, []);

      const variants = [
        { id: "wizard", label: "1. Wizard multi-passo", Comp: WizardVariant },
        { id: "single", label: "2. Página única", Comp: SinglePageVariant },
        { id: "split", label: "3. Lado-a-lado com pré-visualização", Comp: SplitVariant },
      ];
      const Cur = variants.find((v) => v.id === variant)?.Comp || WizardVariant;

      const savedLabel = savedAt
        ? `Guardado às ${savedAt.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" })}`
        : "";

      // On mobile, show the full-screen wizard unless user explicitly exited it
      if (isMobile && !mobileExited && !previewing) {
        return (
          <MobileWizard
            data={data}
            setField={setField}
            onExit={() => setMobileExited(true)}
            onExport={exportPDF}
          />
        );
      }

      return (
        <>
          <div className="variant-tabs">
            <span className="brand">bimby<sup style={{ fontSize: 10 }}>®</sup></span>
            <div className="variant-buttons" style={{ display: "flex", gap: 8 }}>
              {variants.map((v) => (
                <button key={v.id} className={variant === v.id ? "on" : ""} onClick={() => setVariant(v.id)}>
                  {v.label}
                </button>
              ))}
            </div>
            <select className="variant-picker" value={variant} onChange={(e) => setVariant(e.target.value)}
              style={{ display: "none", flex: 1, padding: "10px 12px", borderRadius: 8, border: "1px solid #eef0ec", fontSize: 13, fontFamily: "inherit", background: "#fff", minHeight: 44 }}>
              {variants.map((v) => <option key={v.id} value={v.id}>{v.label}</option>)}
            </select>
            <span className="saved">{savedLabel}</span>
            <div className="actions" style={{ display: "flex", gap: 8 }}>
              {isMobile && (
                <button onClick={() => { setMobileExited(false); setPreviewing(false); }} style={{ background: "#fff", color: "#1f7a48", borderColor: "#1f7a48" }}>
                  ← Wizard
                </button>
              )}
              <button onClick={() => setPreviewing(p => !p)} style={{ background: previewing ? "#1f7a48" : "#fff", color: previewing ? "#fff" : "#1f7a48", borderColor: "#1f7a48" }}>
                {previewing ? "← Voltar" : "👁 Pré-visualizar"}
              </button>
              <button onClick={exportPDF} style={{ background: "#D9192C", color: "#fff", borderColor: "#D9192C" }}>
                📄 Exportar PDF
              </button>
            </div>
          </div>

          <div className="variant-shell">
            <Cur data={data} setField={setField} />
          </div>

          {/* Always rendered, but only visible when printing */}
          <div className="pdf-print-only">
            <PDFForm data={data} signatureDataUrl={data.assinatura} />
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
